name: Premium HUD visual contracts

on:
  pull_request:
    paths:
      - "gui/theme.py"
      - "gui/style.py"
      - "gui/widgets.py"
      - "gui/window.py"
      - "gui/settings_page.py"
      - "tests/test_premium_ui.py"
      - "tests/test_premium_ui_qt.py"
      - ".github/workflows/premium-ui.yml"
  push:
    branches:
      - feature/premium-hud-20261114

permissions:
  contents: read

jobs:
  premium-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Qt for offscreen smoke tests
        run: python -m pip install "PyQt6>=6.6,<7" psutil
      - name: Compile modified Qt modules without GUI execution
        run: python -m py_compile gui/theme.py gui/style.py gui/widgets.py gui/window.py gui/settings_page.py tests/test_premium_ui.py tests/test_premium_ui_qt.py
      - name: Visual contracts
        run: python -m unittest discover -s tests -p test_premium_ui.py -v
      - name: Offscreen premium Qt widget rendering
        run: python -m unittest discover -s tests -p test_premium_ui_qt.py -v
      - name: Sidebar and restart regression contracts
        run: python -m unittest discover -s tests -p test_restart_and_layout.py -v
