name: JARVIS left-controls and restart tests

on:
  push:
    branches:
      - feature/left-controls-auto-restart
  pull_request:
    paths:
      - "gui/window.py"
      - "core/restart_manager.py"
      - "tests/test_restart_and_layout.py"
      - ".github/workflows/jarvis-ui-restart.yml"

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Syntax check
        run: python -m py_compile gui/window.py core/restart_manager.py tools/restart_app.py tests/test_restart_and_layout.py
      - name: Restart and layout checks (no live processes)
        run: python -m unittest discover -s tests -p test_restart_and_layout.py -v
