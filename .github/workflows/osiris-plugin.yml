name: OSIRIS voice bridge tests
on:
  push:
    branches: [main, feature/osiris-world-command]
  pull_request:
    paths: ["plugins/**", "actions/**", "core/**", "gui/**", "ui.py", "requirements.txt", "integrations/osiris/**", "tools/*osiris.py", "tests/**", "tests/test_location_map.py", ".github/workflows/osiris-plugin.yml"]
permissions:
  contents: read
jobs:
  bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbcommon0 libgbm1
      - run: python -m pip install "PyQt6>=6.6,<7" "PyQt6-WebEngine>=6.6,<7" psutil
      - run: python -m compileall -q gui plugins tools tests ui.py
      - name: Restart lifecycle
        run: python -m unittest discover -s tests -p test_restart_app.py -v
      - name: Safe application updater
        run: python -m unittest discover -s tests -p test_app_updater.py -v
      - name: Voice command routing
        run: python -m unittest discover -s tests -p test_osiris_world.py -v
      - name: Read-only information
        run: python -m unittest discover -s tests -p test_osiris_intel.py -v
      - name: Local service lifecycle
        run: python -m unittest discover -s tests -p test_osiris_service.py -v
      - name: JavaScript adapter contracts
        run: node --test tests/test_osiris_bridge.mjs
      - name: Qt same-document transport (offline fixture, not live globe)
        run: python -m unittest discover -s tests -p test_osiris_qt.py -v
      - name: Personal city map regression
        run: python -m unittest discover -s tests -p test_location_map.py -v
