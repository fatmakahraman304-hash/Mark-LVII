name: NEXUS Gemini Android APK
on:
  push:
    branches: [feature/jarvis-nexus-usb]
    paths:
      - "portable/nexus-gemini-android/**"
      - ".github/workflows/nexus-gemini-android.yml"
  pull_request:
    paths:
      - "portable/nexus-gemini-android/**"
      - ".github/workflows/nexus-gemini-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use GitHub runner Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android TV debug APK (no Gemini credentials)
        working-directory: portable/nexus-gemini-android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload manually installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-GEMINI-ANDROID-TV-DEBUG-APK
          path: portable/nexus-gemini-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
